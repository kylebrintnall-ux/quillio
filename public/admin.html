<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quillio — LiveSpecs Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Design-system tokens, copied in from app.html/settings.html/onboarding.html
       — this file has no shared stylesheet to link (none exists anywhere in
       public/), so every shell including this one carries its own copy.
       Values are SURFACES-HANDOFF.md §0's, verified against app.html's actual
       shipped :root rather than trusted from the doc — see CLAUDE.md on why
       that check matters here specifically (the doc and the code disagree on
       at least one exception elsewhere in this project). */
    :root {
      --q-cream: #FCF6E3;
      --q-cream-75: rgba(252,246,227,.75);
      --q-cream-55: rgba(252,246,227,.55);
      --q-fill: #FDF6DC;
      --q-ink: #0A2233;
      --q-gold: #F5C518;
      --q-plum: #3D3566;
      --q-display: 'StarCrush', serif;
      --q-body: 'Zen Kaku Gothic New', sans-serif;
      /* --q-glass (rgba(21,44,112,.55) elsewhere) has no consumer in app.html/
         settings.html/onboarding.html either — SURFACES-HANDOFF.md §5 defines
         it for a BLURRED floating surface over the sky gradient. This page has
         no sky gradient (see the body rule below), so there is nothing behind
         a blur to obscure — a backdrop-filter over a flat fill changes nothing
         a reader can see and only costs a paint. Used here at full opacity
         instead, as the one other flat surface this screen needs (the
         approve/preview overlay) — same hue family as the page, distinguished
         by lightness/hue rather than by blur.  rgb(21,44,112) = #152C70. */
      --q-glass-solid: rgb(21,44,112);

      /* STATUS COLOUR STAYS ON THIS SURFACE — FIXES-HANDOFF.md §9 ("no red, no
         green — glyph only") is deliberately NOT applied here. That rule was
         written for banners and toasts on customer-facing marketing surfaces,
         where hue is decoration layered on top of a message and must not be
         the only carrier of it. Admin is an operations console whose weekly
         job is spotting the one broken row in a 14-row scan; hue IS the
         mechanism that scan runs on, same as the diff view's old/new colouring
         and the health table's error-row tint. Keeping it is the deliberate
         choice, not an oversight of §9.
         Values differ from the pre-rebrand --danger (#E86A6A) and --ok
         (#5FB98E): measured against THIS file's actual backgrounds
         (--q-plum and --q-glass-solid, both computed analytically — see the
         PR notes for the full table), #E86A6A read 3.53:1 / 4.12:1 and
         #5FB98E read 4.64:1 / 5.42:1 — one failing outright, the other too
         thin a margin to trust. Both lightened within the same hue family
         until they cleared 4.5:1 on both surfaces; --q-warn was already safe
         (5.13:1 / 5.99:1) and is unchanged. */
      --q-warn: #E8A33D;
      --q-danger: #FF9E9E;  /* was #E86A6A */
      --q-ok: #6FC79C;      /* was #5FB98E */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      /* NO sky gradient, NO grain texture on this surface — a deliberate call,
         not an omission. Two reasons:
         1. SURFACES-HANDOFF.md's nine-stop gradient + soft-light grain were
            built for surfaces meant to be glanced at (brief-writing,
            onboarding). This is a console Kyle reads for minutes at a time,
            comparing hashes and dates across 14 rows. A flat --q-plum ground
            makes every text/background pair on this page a fixed, exactly
            computable ratio instead of a check against a moving nine-stop
            ramp — FIXES-HANDOFF.md §6 already had to walk the floating-glass
            treatment back once (.55 → .9 opacity) because it read as
            unreadable over a busy background; a scrolling data table is a
            harder version of the same risk, not an easier one.
         2. Mechanical: the texture asset is cache-busted with ?v=__BUILD__,
            substituted only by renderShell (src/utils/shellHtml.js). This
            route serves the file with a plain sendFile (src/routes/admin.js),
            so the query string would ship as the literal, un-substituted
            string "__BUILD__" — a broken, uncached-forever asset URL. Fixing
            that means routing this page through renderShell, which is a
            serving-mechanism change, not a style change, and out of scope
            here. Left off; said so, rather than shipping a broken URL. */
      background: var(--q-plum);
      color: var(--q-cream);
      font-family: var(--q-body);
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-family: var(--q-display); font-weight: normal; font-size: 24px; letter-spacing: .02em; margin: 0 0 6px; }
    h2 { font-family: var(--q-display); font-weight: normal; font-size: 14px; color: var(--q-cream);
      text-transform: uppercase; letter-spacing: 2px; margin: 28px 0 10px; }
    /* Full cream, not a dimmed variant — FIXES-HANDOFF.md §7 already learned
       this once for prose people have to read ("full-opacity cream... not the
       muted 0.75/rgba(...,.78) these used to share"); no reason to relearn it
       here by reaching for admin's old opacity:.65. */
    .sub { color: var(--q-cream); font-size: 13px; margin: 0 0 20px; max-width: 64ch; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

    button { font: inherit; font-weight: 600; border-radius: 0; border: 1px solid var(--q-cream);
      padding: 10px 16px; cursor: pointer; background: transparent; color: var(--q-cream); }
    button.primary { background: var(--q-fill); color: var(--q-ink); border-color: var(--q-cream); }
    button.warn { border-color: var(--q-warn); color: var(--q-warn); }
    button:hover:not(:disabled) { background: var(--q-gold); border-color: var(--q-gold); color: var(--q-ink); }
    /* Same fill-on-hover convention as the plain button above, own colour —
       not gold, so Dismiss doesn't borrow the "confirm" button's hover cue. */
    button.warn:hover:not(:disabled) { background: var(--q-warn); border-color: var(--q-warn); color: var(--q-ink); }
    /* Disabled controls are the one place WCAG itself doesn't require 4.5:1
       (inactive components are excluded) — opacity alone is fine here, unlike
       on a field a user is meant to read. Paired with a style change (dotted,
       not solid) because this project has already shipped a disabled control
       that read as enabled at low opacity alone; a second visual cue is cheap
       insurance against the same mistake. */
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* --- Flag card: SHARED classes below (.card/.title/.badge/.meta/.actions/
       button) change SHAPE ONLY per the accepted-collateral call — zero
       radius, new fill, new type. flagCard()'s own markup and content are
       untouched: no field added or removed, no layout rework. --- */
    .card { background: transparent; border: 1px solid var(--q-cream); border-radius: 0; padding: 16px; margin-bottom: 12px; }
    .card.test { border-style: dashed; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .title { font-weight: 700; font-size: 16px; color: var(--q-cream); }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 0; letter-spacing: .05em;
      background: transparent; border: 1px solid var(--q-cream); color: var(--q-cream); }
    .meta { font-size: 12.5px; color: var(--q-cream-75); word-break: break-all; margin: 6px 0; }
    .hash { font-family: var(--q-body); font-size: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    /* Flag card only: separates Dismiss from Review change… so they read as
       different tiers of action rather than peers — same dotted-divider idiom
       .wl-table already uses for a repeat, reused here for a tier split. Only
       applied when there's a primary group above it to separate FROM (a test
       card, which has no Review change… button, keeps the plain .actions
       spacing it always had). */
    .dismiss-row { margin-top: 4px; padding-top: 10px; border-top: 1px dotted var(--q-cream-55); }
    .empty { border: 1px dotted var(--q-cream); color: var(--q-cream-75); font-style: italic;
      font-size: 14px; text-align: center; padding: 24px 20px; background: transparent; }

    /* Secondary/metadata text: --q-cream-75, never -55. Measured against THIS
       page's actual background (--q-plum) rather than assumed — the system's
       own default muted step, -55, computes to 4.31:1 here and fails AA; -75
       clears at 6.54:1. This is exactly the trap flagged going in: admin's old
       ladder (opacity .7/.65/.6/.55) is a documented AA failure on this
       project twice already (CLAUDE.md, "DIMMING CANNOT CARRY HIERARCHY"), and
       copying a system token without checking it against this background
       would have been a third. -55 stays in use below, but only for borders
       and placeholders — never for text a reader has to read. */
    .note { font-size: 12.5px; color: var(--q-cream-75); }

    /* THE ONLY ANCHOR ON THIS PAGE, and it needed its own rule — found in a
       browser pass, invisible to every string test in the suite.
       Added with no styling, it inherited the USER-AGENT default (#0000EE) and
       measured 1.37:1 against the overlay's rgb(21,44,112). The AA floor is
       4.5. That is the .lib-resetbtn failure again — a colour that looks
       unremarkable in source and is near-invisible on the surface it actually
       lands on — and it was on a link whose whole job is to be clicked.
       Full-strength cream, not -75: this is an action, not metadata. The
       underline carries "link" so hue is not the only signal, which is the
       same reason this page keeps a second cue on its disabled controls.
       overflow-wrap because a real spec URL is one unbreakable token ~80
       characters long, and .note (unlike .meta) sets no word-break. */
    #panel a { color: var(--q-cream); text-decoration: underline; overflow-wrap: anywhere; }
    #panel a:visited { color: var(--q-cream); }
    #panel a:hover { color: var(--q-gold); }
    .summary { font-size: 13.5px; margin: 0 0 12px; color: var(--q-cream); }
    .summary > div { margin: 4px 0; }

    /* --- The agentic proposal (shadow mode) ---------------------------------
       Rendered beside each field on the approve form so confirming is "does
       this look right" rather than "go and read the page yourself". It is
       EVIDENCE, never an instruction: nothing here writes, nothing here ticks
       a checkbox, and a proposal that could not ground its own citation
       deliberately does not pre-fill the input.

       COLOUR: --q-cream-75 for every muted line, never -55. That is not a
       preference, it is the number measured against THIS page's --q-plum
       background and recorded twenty lines above — -55 computes to 4.31:1 and
       fails AA here, -75 clears at 6.54:1. NOT independently re-measured for
       these rules: scripts/checkContrast.js has a fixture for settings.html
       only, and admin.html is one of the three pages with no fixture at all,
       so this inherits a measurement rather than making one. Reusing the one
       token this page has already proven is the safe move available. */
    .agent { margin: 6px 0 2px; padding: 8px 10px; border-left: 2px solid var(--q-cream-55); }
    .agent-head { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--q-cream); }
    /* 12.5px, matching .note — this page's smallest proven-legible body size.
       Hierarchy below comes from weight and case, not from a further dim step:
       "muted label" is the tool this project has twice measured into an AA
       failure (CLAUDE.md, "DIMMING CANNOT CARRY HIERARCHY"). */
    .agent-line { font-size: 12.5px; color: var(--q-cream-75); margin: 3px 0; }
    .agent-quote { font-size: 12.5px; color: var(--q-cream-75); margin: 4px 0;
      padding-left: 8px; border-left: 1px dotted var(--q-cream-55); font-style: italic; }
    .agent-val { color: var(--q-cream); font-weight: 700; font-style: normal; }
    /* An ambiguity is the thing a reviewer is being asked to settle, so it is
       full-strength ink on a marked row rather than another muted line. The
       amber left border is the same "look here" idiom .err-row uses, one step
       down in severity: this is not an error, it is a question. */
    .agent-amb { font-size: 12.5px; color: var(--q-cream); margin: 3px 0;
      border-left: 2px solid var(--q-warn); padding-left: 8px; }
    .agent-amb b { letter-spacing: .03em; }
    /* The one state that must not read as a normal proposal. */
    .agent.ungrounded { border-left-color: var(--q-danger); }

    /* --- The three tables on this page (watch list, approve-form, diff
       preview) share one responsive pattern: stacked cards below 768px, a
       real table at and above it — the same mobile-first convention
       app.html/settings.html/onboarding.html already use (min-width:768px is
       their recurring desktop breakpoint too; iPad clears it and keeps the
       table). Every <td> carries data-label, read by the mobile view's
       ::before to show a field name above its value.
       Row-repeat convention: SURFACES-HANDOFF.md §4 was written for <div>
       rows and says nothing about a table, so this is a new call, not a
       lookup — solid border marks the one outer container (the page-level
       #healthTableWrap on the open page; #panel's own border already plays
       that role for the two tables inside it, so they get no extra wrap),
       dotted marks a repeat inside it, matching the div convention exactly.
       On mobile each stacked row IS its own outer container (no shared table
       edge to belong to), so it takes a full solid border instead — the same
       shape .project-card already uses for a standalone repeating unit. --- */
    #healthTableWrap { border: 1px solid var(--q-cream); padding: 4px 14px; margin-top: 8px; }
    table.wl-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
    .wl-table thead { display: none; }
    .wl-table tbody tr { display: block; padding: 12px 0; }
    .wl-table tbody tr + tr { border-top: 1px dotted var(--q-cream-55); }
    .wl-table tbody tr.err-row { background: rgba(255,158,158,.12); border-left: 3px solid var(--q-danger); padding-left: 11px; }
    .wl-table td { display: block; padding: 3px 0; border: none; text-align: left; vertical-align: top; }
    .wl-table td[data-label]::before {
      content: attr(data-label); display: block; font-family: var(--q-body);
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
      color: var(--q-cream-75); margin-bottom: 2px;
    }
    @media (min-width: 768px) {
      #healthTableWrap { padding: 4px 16px 12px; }
      .wl-table thead { display: table-header-group; }
      .wl-table th { text-align: left; padding: 8px; border-bottom: 1px solid var(--q-cream);
        font-family: var(--q-body); font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: .06em; color: var(--q-cream-75); }
      .wl-table tbody tr { display: table-row; padding: 0; }
      .wl-table tbody tr.err-row { background: none; border-left: none; padding-left: 0; }
      .wl-table tbody tr.err-row td { background: rgba(255,158,158,.12); }
      .wl-table tbody tr.err-row td:first-child { border-left: 3px solid var(--q-danger); }
      .wl-table td { display: table-cell; padding: 8px; }
      .wl-table td[data-label]::before { display: none; }
    }

    input[type=text], input[type=number] {
      font: inherit; background: transparent; color: var(--q-cream);
      border: 1px solid var(--q-cream); border-radius: 0; padding: 7px 9px; width: 100%;
    }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--q-cream); }
    input::placeholder { color: var(--q-cream-55); }
    input:disabled { opacity: .4; border-style: dotted; }

    .diff-old { color: var(--q-danger); }
    .diff-new { color: var(--q-ok); font-weight: 700; }

    #overlay { position: fixed; inset: 0; background: rgba(21,44,112,.7); display: none; padding: 24px; overflow: auto; }
    #panel { max-width: 760px; margin: 0 auto; background: var(--q-glass-solid);
      border: 1px solid var(--q-cream); border-radius: 0; padding: 22px; color: var(--q-cream); }
    #panel h1 { font-size: 20px; }

    .msg { padding: 10px 12px; border-radius: 0; margin: 10px 0; font-size: 13.5px; border: 1px solid transparent; }
    .msg.err { background: rgba(255,158,158,.15); border-color: var(--q-danger); }
    .msg.ok { background: rgba(111,199,156,.15); border-color: var(--q-ok); }
    /* Tenant divergence: this write has no tenant predicate, so a row holding a
       different value is about to be overwritten. Amber — it is a fact the admin
       must weigh, not an error that blocks the write. */
    .msg.warn { background: rgba(232,163,61,.15); border-color: var(--q-warn); }
    .diverge { font-size: 12.5px; color: var(--q-warn); margin-top: 4px; }
    .diverge ul { margin: 3px 0 0; padding-left: 16px; }
    .diverge li { margin: 1px 0; }
  </style>
</head>
<body>
  <h1>LiveSpecs — Admin</h1>
  <p class="sub">Detection health + the pending review queue. Approve writes production spec values (with a diff you confirm first); dismiss clears a false positive. Test flags can only be dismissed.</p>

  <h2>Detection Health</h2>
  <div id="healthSummary" class="summary"></div>
  <div id="healthTableWrap"></div>
  <div class="bar">
    <button id="runBtn" class="primary">Run detection now</button>
    <button id="refreshBtn">Refresh</button>
    <span id="runMsg" class="note"></span>
  </div>

  <!-- A DEEP-LINKED FLAG, shown whatever its status. The queue below renders
       only `pending`, so a link to a flag that was just CONFIRMED lands on a
       console that has already dropped it -- a link that reliably shows nothing
       is worse than no link. This panel is empty and takes no space unless
       ?flag=<id> is in the URL. -->
  <div id="linkedFlag"></div>

  <h2>Flags</h2>
  <div id="realList"></div>
  <h2>Test flags</h2>
  <div id="testList"></div>

  <div id="overlay"><div id="panel"></div></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const overlay = $('overlay'), panel = $('panel');

// Always render dynamic values as text (never innerHTML) to avoid injection.
function el(tag, props={}, kids=[]) {
  const n = document.createElement(tag);
  for (const k in props) {
    if (k === 'class') n.className = props[k];
    else if (k === 'text') n.textContent = props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  for (const c of [].concat(kids)) if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return n;
}
async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({ success:false, error:'bad response' }));
  if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
function short(h){ return h ? String(h).slice(0,10) : '—'; }
function closeOverlay(){ overlay.style.display='none'; panel.innerHTML=''; }

// --- Detection health (read-only) ---
function relTime(iso){
  if(!iso) return 'never';
  const s = Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<0) return 'just now';
  if(s<60) return s+'s ago';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
// Next Monday 15:00 UTC (the cron: 0 15 * * 1), as a readable UTC string.
function nextMondayCron(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),15,0,0,0));
  while(d.getUTCDay()!==1 || d.getTime()<=now.getTime()) d.setUTCDate(d.getUTCDate()+1);
  return d.toISOString().slice(0,16).replace('T',' ')+' UTC';
}
async function loadHealth(){
  const sum=$('healthSummary'), wrap=$('healthTableWrap');
  sum.textContent=''; wrap.innerHTML='';
  let h;
  try { h = await api('/admin/api/health'); }
  catch(e){ sum.appendChild(el('div',{class:'msg err',text:'Health load failed: '+e.message})); return; }
  const watch = h.watch || [];
  // Observed-practice sources are not hash-watched, so every count that measures
  // the hash watch excludes them. Including them would inflate numbers that
  // describe a real gap on the rows they apply to — and would report a row as
  // erroring on the strength of a last_error nothing has refreshed since it was
  // reclassified.
  const hashWatched = watch.filter(w=>w.source_kind !== 'observed_practice');
  const notWatched = watch.length - hashWatched.length;
  const withErrors = hashWatched.filter(w=>w.last_error).length;
  const pending = watch.reduce((a,w)=>a+(w.pending_count||0),0);
  const unanchored = hashWatched.filter(w=>!w.anchored).length;
  const alertAt = h.unconfirmedAlertAt || 3;
  const stuck = hashWatched.filter(w=>w.consecutive_unconfirmed >= alertAt).length;
  sum.appendChild(el('div',{},['Last detection run: '+(h.lastRun ? relTime(h.lastRun)+' ('+new Date(h.lastRun).toLocaleString()+')' : 'never')]));
  sum.appendChild(el('div',{},['Last run result: '+hashWatched.length+' hash-watched · '+withErrors+' with error(s) · '+pending+' pending flag(s)']));
  // Unanchored entries are still checked, but nothing verifies the fetch read the
  // right page — say so on the summary line rather than only in the table.
  sum.appendChild(el('div',{},['Anchors: '+(hashWatched.length-unanchored)+' of '+hashWatched.length+' asserted'+(unanchored?' · '+unanchored+' unanchored':'')]));
  if(notWatched) sum.appendChild(el('div',{},['Not hash-watched: '+notWatched+' observed-practice source'+(notWatched===1?'':'s')+' — dated guidance, never flagged']));
  // A stuck entry is read successfully every week and still not watched, which
  // is why it needs saying on the summary rather than only in a row.
  if(stuck) sum.appendChild(el('div',{},['Stuck: '+stuck+' entr'+(stuck===1?'y':'ies')+' with no usable comparison for '+alertAt+'+ runs']));
  sum.appendChild(el('div',{class:'note'},['Next scheduled run: '+nextMondayCron()+' — Mondays 15:00 UTC (0 15 * * 1)']));
  const table=el('table',{class:'wl-table'});
  const thead=el('thead');
  thead.appendChild(el('tr',{},[
    el('th',{text:'Watch'}), el('th',{text:'Type'}), el('th',{text:'Last checked'}),
    el('th',{text:'Baselined'}), el('th',{text:'Anchor'}), el('th',{text:'Problem'}), el('th',{text:'Pending'}),
  ]));
  table.appendChild(thead);
  const tbody=el('tbody');
  for(const w of watch){
    const observed = w.source_kind === 'observed_practice';
    // Every hash-watch column on an observed-practice row is historical: nothing
    // has fetched it since it was reclassified, and nothing will. Reading them as
    // current is the one wrong conclusion this table can lead someone to.
    const fails = observed ? null : w.consecutive_failures;
    const stuckAt = observed ? 0 : w.consecutive_unconfirmed;
    const isStuck = stuckAt >= alertAt;
    const tr = el('tr', (!observed && (w.last_error || fails>1 || isStuck)) ? {class:'err-row'} : {});
    tr.appendChild(el('td',{'data-label':'Watch'},[el('div',{class:'title',text:w.display_name||'(no name)'}), el('div',{class:'note',text:w.source_url})]));
    tr.appendChild(el('td',{'data-label':'Type'},[
      el('span',{class:'badge '+(w.is_test?'test':'real'),text:w.is_test?'TEST':'REAL'}),
      observed ? el('div',{class:'note',text:'observed practice'}) : null,
    ].filter(Boolean)));
    tr.appendChild(el('td',{'data-label':'Last checked',text:observed?'not checked':relTime(w.last_checked_at)}));
    tr.appendChild(el('td',{'data-label':'Baselined',text:observed?'n/a':(w.baselined?'yes':'no')}));
    tr.appendChild(el('td',{'data-label':'Anchor'},[
      el('div',{text:observed?'n/a':(w.anchored?'yes':'none')}),
      // A run of failures is the signal that an anchor is wrong rather than that
      // the site had one bad morning, so it goes next to the anchor, not the error.
      fails ? el('div',{class:'note',text:fails+' failed run'+(fails===1?'':'s')+' in a row'}) : null,
    ].filter(Boolean)));
    // ONE COLUMN, because a reader asks one question of it: what is wrong with
    // this entry. An error and an unconfirmed streak are different causes, but
    // they are not different questions — the counters are separate because CODE
    // branches on them, which is not true of a table cell.
    // The streak shows from 1 upward, deliberately: a row climbing 1 -> 2 is the
    // early signal, and holding the note until the alert threshold would make a
    // month of drift appear fully formed with no warning.
    tr.appendChild(el('td',{'data-label':'Problem'},
      observed ? [
        el('div',{text:'observed practice — not hash-watched'}),
        el('div',{class:'note',text:'ages rather than changes; can never raise a flag'}),
      ]
      : w.last_error ? [el('div',{text:w.last_error})]
      : stuckAt ? [
          el('div',{text:'unconfirmed '+stuckAt+' run'+(stuckAt===1?'':'s')+' in a row'+(isStuck?' — NOT BEING WATCHED':'')}),
          w.unconfirmed_reason ? el('div',{class:'note',text:w.unconfirmed_reason}) : null,
        ].filter(Boolean)
      : [el('div',{text:'—'})]
    ));
    tr.appendChild(el('td',{'data-label':'Pending',text:String(w.pending_count||0)}));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
}
function loadAll(){ loadHealth(); loadQueue(); }

// The ?flag=<id> a notification links to. Read once per load from the real URL.
function linkedFlagId() {
  try {
    const v = new URLSearchParams(window.location.search).get('flag');
    return v && /^\d+$/.test(v) ? v : null;
  } catch (e) { return null; }
}

// Render the deep-linked flag, whatever its status.
//
// NO EXTRA FETCH: /admin/api/review-queue already returns EVERY row regardless
// of status (db/specWatch.getReviewQueue has no WHERE), so the row a link points
// at is already in the payload the queue just filtered it out of.
//
// It says the STATUS rather than implying one. A reviewed flag reached here from
// a notification saying the change was confirmed; a dismissed one did not, and a
// still-pending one is also in the list below. Naming which it is, is the whole
// job of this panel.
function renderLinkedFlag(rows) {
  const host = $('linkedFlag');
  host.innerHTML = '';
  const id = linkedFlagId();
  if (!id) return;
  const f = rows.find(r => String(r.id) === id);
  host.appendChild(el('h2',{},['Linked flag']));
  if (!f) {
    host.appendChild(el('p',{class:'msg err',text:'No flag #'+id+' — it may have been deleted.'}));
    return;
  }
  const card = flagCard(f, !!f.is_test);
  card.insertBefore(
    el('div',{class:'meta',text:'status: '+f.status}),
    card.firstChild ? card.firstChild.nextSibling : null
  );
  host.appendChild(card);
}

async function loadQueue() {
  $('realList').innerHTML = ''; $('testList').innerHTML = '';
  let rows;
  try { rows = (await api('/admin/api/review-queue')).reviewQueue; }
  catch (e) { $('realList').appendChild(el('p',{class:'msg err',text:'Failed to load: '+e.message})); return; }
  renderLinkedFlag(rows);
  const pending = rows.filter(r => r.status === 'pending');
  const real = pending.filter(r => !r.is_test);
  const test = pending.filter(r => r.is_test);
  renderList($('realList'), real, false);
  renderList($('testList'), test, true);
}
function renderList(container, list, isTest) {
  if (!list.length) { container.appendChild(el('p',{class:'empty',text:'None pending.'})); return; }
  for (const f of list) container.appendChild(flagCard(f, isTest));
}
function flagCard(f, isTest) {
  const card = el('div',{class:'card'+(isTest?' test':'')});
  card.appendChild(el('div',{class:'row'},[
    el('span',{class:'title',text:f.source_url}),
    el('span',{class:'badge '+(isTest?'test':'real'),text:isTest?'TEST':'REAL'}),
  ]));
  card.appendChild(el('div',{class:'meta'},['flag #'+f.id+' · detected '+new Date(f.detected_at).toLocaleString()]));
  card.appendChild(el('div',{class:'meta hash'},['old '+short(f.old_hash)+'  →  new '+short(f.new_hash)]));
  const agentBadge = agentQueueLine(f.agent_proposal);
  if (agentBadge) card.appendChild(el('div',{class:'meta',text:agentBadge}));
  // Two groups, not one row: Review change… opens a two-step write, Dismiss
  // closes the flag in one. They read as peers when they sit in the same
  // .actions block with nothing between them — that was the defect. The
  // dotted top border on the second group is the same repeat-divider the rest
  // of this page already uses (.wl-table's row rule), reused here for a tier
  // split rather than a repeat.
  if (!isTest) {
    card.appendChild(el('div',{class:'actions'},[
      el('button',{class:'primary',onclick:()=>openApprove(f.id)},['Review change…']),
    ]));
  }
  card.appendChild(el('div',{class:'actions'+(isTest?'':' dismiss-row')},[
    el('button',{class:'warn',onclick:()=>doDismiss(f.id)},['Dismiss']),
  ]));
  return card;
}
async function doDismiss(flagId) {
  if (!confirm('Dismiss flag #'+flagId+'? (marks it dismissed; no spec change)')) return;
  try { await api('/admin/api/dismiss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flagId})}); loadAll(); }
  catch (e) { alert('Dismiss failed: '+e.message); }
}

// --- Approve flow: form → preview → confirm ---
async function openApprove(flagId) {
  let flag;
  try { flag = (await api('/admin/api/flag/'+flagId)).flag; }
  catch (e) { alert('Load failed: '+e.message); return; }
  panel.innerHTML='';
  // The step marker is what tells a reader this screen is not the end — the
  // word "Approve" used to carry that job and didn't: clicking it opened this
  // checklist, which has no control that writes anything.
  panel.appendChild(el('h1',{text:'Step 1 of 2 — choose fields (flag #'+flag.id+')'}));
  // A LINK, not text. The whole point of the proposal below is that confirming
  // should be a glance rather than a research task — and the one thing a glance
  // needs, when a proposal is flagged for a human, is the page itself one click
  // away. rel=noopener because target=_blank without it hands the opened page a
  // handle on this one.
  panel.appendChild(el('p',{class:'note'},[
    el('a',{href:flag.source_url,target:'_blank',rel:'noopener noreferrer',text:flag.source_url}),
  ]));
  panel.appendChild(el('p',{class:'note',text:'Check only the field(s) this change actually applies to, and type the new value. Unchecked fields are never touched.'}));
  panel.appendChild(el('p',{class:'note',text:agentPanelNote(flag)}));

  const table = el('table',{class:'wl-table'});
  const thead = el('thead');
  thead.appendChild(el('tr',{},[
    el('th',{text:'✓'}), el('th',{text:'Asset / Field'}), el('th',{text:'Current char_max'}),
    el('th',{text:'New char_max'}), el('th',{text:'New spec_note (optional)'}),
  ]));
  table.appendChild(thead);
  const tbody = el('tbody');
  const inputs = [];
  // Created before the loop so the per-row checkbox listener can close over it.
  // Starts disabled — "checked at least one field" is a real precondition for
  // moving forward and the control now says so, instead of only preview()'s
  // inline error saying so after the fact (kept below as a fallback).
  const nextBtn = el('button',{class:'primary',onclick:()=>preview(flag, inputs, msg)},['Next: review diff →']);
  nextBtn.disabled = true;
  for (const fld of flag.fields) {
    const cb = el('input',{type:'checkbox'});
    const cmax = el('input',{type:'number',min:'1',placeholder:fld.current_char_max||''});
    const note = el('input',{type:'text',placeholder:'leave blank to keep'});
    const hint = el('div',{class:'note'});
    cmax.disabled = true; note.disabled = true;
    // Extended, not a second listener: the existing per-row toggle now also
    // re-evaluates across ALL rows, since one box anywhere is enough to move
    // forward. inputs already holds every earlier row by the time this fires
    // (it's an async event, long after the loop that builds it has finished).
    cb.addEventListener('change',()=>{
      cmax.disabled=!cb.checked; note.disabled=!cb.checked;
      nextBtn.disabled = !inputs.some((r)=>r.cb.checked);
    });
    inputs.push({fld, cb, cmax, note, hint});
    // Divergence shown on the FORM as well as the preview: an admin choosing what
    // to type should know up front that tenants don't currently agree.
    const cell = el('td',{'data-label':'Asset / Field'},[el('div',{class:'title',text:fld.asset}), el('div',{class:'note',text:fld.field+' · '+fld.tenant_count+' tenant row(s)'}), hint]);

    // The stored proposal for THIS pair, matched on asset+field the same way
    // suggest() matches its live re-read. A proposal the detector produced for a
    // pair the form no longer renders simply never matches — which is the right
    // outcome, since affected_fields is the gate both sides read.
    const fp = agentProposalFor(flag, fld);
    const block = agentFieldBlock(fp);
    if (block) {
      cell.appendChild(block);
      // PRE-FILL ONLY WHAT THE MODEL COULD GROUND. A number whose citation was
      // not found in the page is displayed in the block above and deliberately
      // NOT written into the input: a value already sitting in the field reads
      // as checked, and this one is the opposite of checked. The admin can still
      // type it — this removes a shortcut, not a choice.
      //
      // `value`, not `placeholder`, for a grounded one: collectEdits submits
      // .value and ignores .placeholder, and the placeholder slot already holds
      // the CURRENT value, which is the comparison this row exists to show.
      // Pre-filling writes nothing on its own — the field still has to be ticked,
      // previewed as a diff and confirmed, which is the same two-step gate
      // “Suggest values” has always fed.
      const grounded = fp.suggestedCharMax != null && (fp.ambiguities || []).indexOf('citation_unverified') < 0;
      if (grounded) cmax.value = String(fp.suggestedCharMax);
    }
    const dMax = divergenceNode(fld.char_max_divergence, 'char_max');
    if (dMax) cell.appendChild(dMax);
    const dNote = divergenceNode(fld.spec_note_divergence, 'spec_note');
    if (dNote) cell.appendChild(dNote);
    tbody.appendChild(el('tr',{},[
      el('td',{'data-label':'Include'},[cb]),
      cell,
      el('td',{'data-label':'Current char_max',text:String(fld.current_char_max||'—')}),
      el('td',{'data-label':'New char_max'},[cmax]), el('td',{'data-label':'New spec_note'},[note]),
    ]));
  }
  table.appendChild(tbody);
  panel.appendChild(table);
  const msg = el('div',{});
  panel.appendChild(msg);
  const bar = el('div',{class:'actions'},[
    el('button',{onclick:()=>suggest(flag, inputs, msg)},['Suggest values']),
    nextBtn,
    el('button',{onclick:closeOverlay},['Cancel']),
  ]);
  panel.appendChild(bar);
  overlay.style.display='block';
}
// --- The persisted agentic proposal (shadow mode) ---------------------------
//
// Read at DETECTION time from the bytes that raised the flag, stored on
// spec_review_queue.agent_proposal, and rendered here so confirming a change is
// "does this look right" rather than "go and read the whole page yourself".
//
// THREE RULES THIS RENDERER KEEPS, all of them load-bearing:
//
//  1. NULL AND [] ARE NOT THE SAME. A null column means no agentic read happened;
//     a 'read' status with an empty fields array means the page was read and
//     stated nothing. Every branch below asks `status` and never infers from the
//     presence or emptiness of `fields` — the stored shape omits that key
//     entirely on any outcome that did not read the page.
//  2. AN UNGROUNDED PROPOSAL NEVER PRE-FILLS. If the model's citation could not
//     be found in the page, the number still SHOWS — suppressing it would hide
//     the fact that the model proposed something — but the input stays empty so
//     the admin has to type it deliberately. A number sitting in the field you
//     are about to confirm reads as checked, and that one was not.
//  3. NOTHING HERE TICKS A CHECKBOX OR WRITES. Shadow mode: the proposal is
//     evidence for a review, never a substitute for one.

function agentQueueLine(p) {
  if (!p) return '';
  if (p.status !== 'read') return 'agent: ' + p.status + (p.reason ? ' (' + p.reason + ')' : '');
  const fields = p.fields || [];
  const proposed = fields.filter((f) => f.suggestedCharMax != null).length;
  const flagged = fields.filter((f) => (f.ambiguities || []).length > 0).length;
  if (!fields.length) return 'agent: read the page, proposed nothing';
  return 'agent: ' + proposed + ' of ' + fields.length + ' field(s) proposed'
    + (flagged ? ' · ' + flagged + ' needing a human' : '');
}

// Wording for one ambiguity code. The codes are stable (the report script buckets
// on them); these sentences are for a person, and each says what to go and check
// rather than naming the trigger that fired.
const AGENT_AMBIGUITY_TEXT = {
  citation_unverified: 'The model could not ground this number — its quote is not on the page. Treat the value as unchecked.',
  citation_fuzzy_match: 'The quote matched only loosely (spacing or capitalisation), so confirm it is the right line.',
  snippet_omits_number: 'The quoted line does not contain the proposed number.',
  conditional_limit: 'The page may state this limit conditionally — check whether a second number applies.',
  multiple_candidates: 'The page states more than one number that could be this limit.',
  large_delta: 'This moves the stored value by a lot.',
  implausible_value: 'This is far outside the range of a copy-field limit.',
  current_value_diverges: 'Tenants do not currently agree on this value.',
  current_value_unknown: 'There is no single stored value to compare against.',
  first_change_since_baseline: 'First change since this page was baselined — there is no prior change to compare against.',
  change_history_unavailable: 'This database has no run history, so that check could not run.',
  page_text_truncated: 'The model saw only the first part of the page.',
};

// The stored proposal for one form row, or null.
//
// GUARDS ON `status` RATHER THAN ON `fields`, which is the whole invariant of the
// stored shape: a skipped or failed read carries NO fields key at all, so reading
// `p.fields` on one would be reading a claim that was deliberately never made.
function agentProposalFor(flag, fld) {
  const p = flag && flag.agent_proposal;
  if (!p || p.status !== 'read' || !Array.isArray(p.fields)) return null;
  for (const f of p.fields) {
    if (f && f.asset === fld.asset && f.field === fld.field) return f;
  }
  return null;
}

function agentFieldBlock(fp) {
  if (!fp) return null;
  const ambiguities = fp.ambiguities || [];
  const ungrounded = ambiguities.indexOf('citation_unverified') >= 0;
  const box = el('div',{class:'agent'+(ungrounded?' ungrounded':'')});
  box.appendChild(el('div',{class:'agent-head',text:'AGENT PROPOSAL'}));

  const proposed = fp.suggestedCharMax != null ? String(fp.suggestedCharMax) : null;
  const line = el('div',{class:'agent-line'});
  if (proposed) {
    line.appendChild(document.createTextNode('proposes '));
    line.appendChild(el('span',{class:'agent-val',text:proposed}));
    line.appendChild(document.createTextNode(' · stored ' + (fp.currentCharMax || '—') + ' · confidence ' + fp.confidence));
  } else {
    line.textContent = 'no value found on the page for this field · stored ' + (fp.currentCharMax || '—');
  }
  box.appendChild(line);

  // The citation. Shown only when it verified — an unverified one is EMPTY in the
  // stored record, by the same rule, so there is nothing here to render and the
  // ambiguity below says why.
  if (fp.snippet) {
    box.appendChild(el('div',{class:'agent-quote',text:'“'+fp.snippet+'”'}));
  }
  if (fp.candidates && fp.candidates.length > 1) {
    box.appendChild(el('div',{class:'agent-line',text:'numbers on the page: '+fp.candidates.join(', ')}));
  }
  for (const code of ambiguities) {
    const amb = el('div',{class:'agent-amb'});
    amb.appendChild(el('b',{text:'CHECK: '}));
    amb.appendChild(document.createTextNode(AGENT_AMBIGUITY_TEXT[code] || code));
    const detail = fp.ambiguityDetail && fp.ambiguityDetail[code];
    if (detail) amb.appendChild(document.createTextNode(' (' + detail + ')'));
    box.appendChild(amb);
  }
  return box;
}

// Panel-level note describing the read as a whole, plus the one staleness fact
// that matters: whether the proposal was taken from the same bytes as this flag.
function agentPanelNote(flag) {
  const p = flag.agent_proposal;
  if (!p) {
    return 'No agentic read for this flag — it predates the feature, or the reader was off '
      + 'when it was raised. Use “Suggest values” to read the page as it is NOW.';
  }
  if (p.status !== 'read') {
    return 'The agent did not read this page (' + p.status
      + (p.reason ? ': ' + p.reason : '') + '). Use “Suggest values” to read it now.';
  }
  const when = p.readAt ? new Date(p.readAt).toLocaleString() : 'an unknown time';
  const stale = p.pageHash && flag.new_hash && p.pageHash !== flag.new_hash;
  return 'Read ' + when + ' from the page that raised this flag'
    + (p.model ? ' (' + p.model + ')' : '') + '. '
    + (stale
      ? 'NOTE: the stored hash no longer matches this flag — the page has moved since. Re-read before trusting it.'
      : 'Nothing below is written until you tick a field and confirm.');
}

// Chunk 3b: read the source page and pre-fill suggested char_max per field.
// Suggestion only — pre-fills the (disabled) input + shows the snippet; the admin
// still ticks the field and confirms the diff. Nothing is written here.
//
// STILL HERE, AND NOW THE RE-READ RATHER THAN THE ONLY READ. The stored proposal
// above was taken when the flag was raised; this button asks the page as it is
// TODAY. Those are different questions and the form says which is which, so the
// button keeps its job instead of being replaced by the persisted record.
async function suggest(flag, inputs, msg) {
  msg.innerHTML='';
  const info = el('div',{class:'msg',text:'Reading the source page… (a few seconds)'});
  msg.appendChild(info);
  let data;
  try { data = await api('/admin/api/flag/'+flag.id+'/suggestions'); }
  catch (e) { info.className='msg err'; info.textContent='Suggest failed: '+e.message; return; }
  const byKey = new Map();
  for (const s of (data.suggestions||[])) byKey.set(s.asset+' '+s.field, s);
  let filled = 0;
  for (const r of inputs) {
    const s = byKey.get(r.fld.asset+' '+r.fld.field);
    r.hint.textContent = '';
    if (s && s.suggested_char_max != null) {
      r.cmax.value = String(s.suggested_char_max);
      r.hint.textContent = 'suggested '+s.suggested_char_max+' ('+s.confidence+')' + (s.snippet ? ' — "'+s.snippet+'"' : '');
      filled++;
    } else if (s) {
      r.hint.textContent = 'no confident value found on the page';
    }
  }
  info.className = 'msg' + (filled ? ' ok' : '');
  info.textContent = filled
    ? 'Pre-filled '+filled+' suggestion(s). Tick the field(s) you want, review the diff, then confirm. Suggestions are not written until you confirm.'
    : ('No confident suggestions' + (data.note ? ' — '+data.note : '') + '. Enter values manually.');
}
function collectEdits(inputs, msg) {
  const edits = [];
  for (const r of inputs) {
    if (!r.cb.checked) continue;
    const e = { asset:r.fld.asset, field:r.fld.field };
    if (r.cmax.value !== '') e.char_max = r.cmax.value;
    if (r.note.value.trim() !== '') e.spec_note = r.note.value;
    edits.push(e);
  }
  return edits;
}
// Render a tenantValueBreakdown as "N row(s) hold X; M hold something else",
// naming the divergent values and the tenants on them. Returns null when every
// row agrees, so the caller renders nothing on the normal path.
//
// This is the whole point of the change: the API used to hand back only a joined
// "150 | 200" string, which showed THAT tenants disagreed but never who, how
// many, or which value was the odd one out — so the write that reverts them
// looked identical to a write that changed nothing.
function divergenceNode(d, label) {
  if (!d || !d.diverged) return null;
  const host = el('div',{class:'diverge'});
  host.appendChild(el('div',{text:
    label+': '+d.expected_row_count+' row(s) hold "'+(d.expected||'∅')+'" · '+
    d.divergent_row_count+' row(s) hold something else and will be overwritten:'}));
  const list = el('ul',{});
  for (const g of d.divergent) {
    list.appendChild(el('li',{text:'"'+(g.value||'∅')+'" — '+g.row_count+' row(s): '+g.tenants.join(', ')}));
  }
  host.appendChild(list);
  return host;
}
async function preview(flag, inputs, msg) {
  msg.innerHTML='';
  const edits = collectEdits(inputs, msg);
  if (!edits.length) { msg.appendChild(el('div',{class:'msg err',text:'Check at least one field and enter a new value.'})); return; }
  let pv;
  try { pv = await api('/admin/api/approve-preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flagId:flag.id,edits})}); }
  catch (e) { msg.appendChild(el('div',{class:'msg err',text:e.message})); return; }
  renderPreview(flag, edits, pv, msg);
}
function renderPreview(flag, edits, pv, msg) {
  panel.innerHTML='';
  // Mirrors Screen 1's marker. "Confirm write" is doing enough work as the one
  // accurate button label in this flow — the heading's job is to say this is
  // the LAST step, not to repeat the button.
  panel.appendChild(el('h1',{text:'Step 2 of 2 — confirm (flag #'+flag.id+')'}));
  panel.appendChild(el('p',{class:'note',text:'Nothing has been written yet. Review the diff, then confirm.'}));
  // Up front, before the table: this write has no tenant filter, so if any row
  // disagrees it is about to be reverted. Stated as a count of fields so it is
  // legible at a glance; the per-row detail sits in the table below.
  if (pv.diverged) {
    panel.appendChild(el('div',{class:'msg warn',text:
      pv.divergent_field_count+' field(s) do not hold the same value across all tenants. '+
      'This write has no tenant filter, so every row below is set to the new value — '+
      'the diverging rows listed will lose what they currently hold.'}));
  }
  const table = el('table',{class:'wl-table'});
  const thead = el('thead');
  thead.appendChild(el('tr',{},[el('th',{text:'Asset / Field'}),el('th',{text:'Attr'}),el('th',{text:'Change'}),el('th',{text:'Tenant rows'})]));
  table.appendChild(thead);
  const tbody = el('tbody');
  for (const c of pv.changes) {
    const cell = el('td',{'data-label':'Asset / Field'},[el('div',{class:'title',text:c.asset}),el('div',{class:'note',text:c.field})]);
    const d = divergenceNode(c.divergence, c.attr);
    if (d) cell.appendChild(d);
    tbody.appendChild(el('tr',{},[
      cell,
      el('td',{'data-label':'Attr',text:c.attr}),
      el('td',{'data-label':'Change'},[el('span',{class:'diff-old',text:String(c.old||'∅')}),document.createTextNode('  →  '),el('span',{class:'diff-new',text:String(c.new)})]),
      el('td',{'data-label':'Tenant rows',text:String(c.tenant_count)}),
    ]));
  }
  table.appendChild(tbody);
  panel.appendChild(table);
  panel.appendChild(el('p',{class:'note',text:'Source: '+pv.source_url}));
  const out = el('div',{});
  panel.appendChild(out);
  panel.appendChild(el('div',{class:'actions'},[
    el('button',{class:'primary',onclick:async()=>{
      try {
        const r = await api('/admin/api/approve-commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flagId:flag.id,edits})});
        out.appendChild(el('div',{class:'msg ok',text:'Written. '+r.written.reduce((a,w)=>a+w.tenant_count,0)+' tenant row(s) updated across '+r.written.length+' field(s); flag marked reviewed; logged.'}));
        // What the write actually reverted. Rendered AFTER the success line and
        // kept on screen longer, because this is the part nobody could see
        // before: a tenant whose value differed is now gone, and the only record
        // of it was a server log line that did not exist either.
        const reverted = [];
        for (const w of r.written) for (const o of (w.overwritten||[])) reverted.push({w,o});
        if (reverted.length) {
          const box = el('div',{class:'msg warn'});
          box.appendChild(el('div',{text:reverted.length+' row(s) held a different value and were overwritten ('
            +r.diverged_overwritten_count+' of them had diverged from the rest):'}));
          const list = el('ul',{});
          for (const {w,o} of reverted) {
            list.appendChild(el('li',{text:'tenant '+o.tenant_id+' — '+w.asset+' / '+w.field+' · '+o.attr+': "'+(o.old_value||'∅')+'" → "'+o.new_value+'"'
              +(o.diverged?'   [diverged — this tenant’s own value is gone]':'')}));
          }
          box.appendChild(list);
          out.appendChild(box);
          setTimeout(()=>{ closeOverlay(); loadAll(); }, 8000);
        } else {
          setTimeout(()=>{ closeOverlay(); loadAll(); }, 1400);
        }
      } catch (e) { out.appendChild(el('div',{class:'msg err',text:'Write failed: '+e.message})); }
    }},['Confirm write']),
    el('button',{onclick:closeOverlay},['Cancel — write nothing']),
  ]));
}

$('refreshBtn').addEventListener('click', loadAll);
$('runBtn').addEventListener('click', async () => {
  $('runBtn').disabled = true; $('runMsg').textContent = 'Running detection…';
  try { const r = await api('/admin/api/run-detection',{method:'POST'}); $('runMsg').textContent = 'Done: '+JSON.stringify(r.summary); loadAll(); }
  catch (e) { $('runMsg').textContent = 'Failed: '+e.message; }
  finally { $('runBtn').disabled = false; }
});
loadAll();
</script>
</body>
</html>
